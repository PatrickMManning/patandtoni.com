      const { createStore } = Redux;

      const initial_state = { page:'HOME', isNavFrozen:false };
	  
      function getAppData(state=initial_state, action) {
        switch(action.type) {
            case('CHANGE_PAGE'):
				return { ...state, page: action.payload }
			case('FREEZE_NAV'):
				return {...state, isNavFrozen: action.payload }
          default:
            return state
        }
      }
      
      function changePage(page){
        return {
          type: 'CHANGE_PAGE',
          payload: page
        };
      }
	  
	  function freezeNav(t_f) {
		return {
			type: 'FREEZE_NAV',
			payload: t_f
		};
	  }
	  
      class NavLink extends React.Component {
        constructor(props){
          super(props);
          this.clickLink = this.clickLink.bind(this);
        }
        clickLink(e) {
          e.preventDefault();
          store.dispatch(changePage(this.props.name));
        }
        render() {
          const navLinkStyle = {
            paddingLeft: '5px',
			color: 'black',
			textDecoration: 'none',
          };
          return(
            <a href={this.props.link} style={navLinkStyle} onClick={this.clickLink}>{this.props.name}</a>
          );
        }
      }
      
      class Nav extends React.Component {
        constructor(props) {

		handleHome(e){
			e.preventDefault();
			store.dispatch(changePage('HOME'));
		}
        render() {
			const state = store.getState();
          const parentStyle = state.isNavFrozen ? {
            position: 'fixed',
			top: '0px',
			display: 'flex',
            justifyContent: 'space-evenly',
			backgroundColor: 'white',
			width: '100%',
			minHeight: '50px',
			paddingTop: '50px',
			borderBottom: '3px solid MistyRose',

			display: 'flex',
            justifyContent: 'space-evenly',
            paddingBottom: '10px',
            paddingTop: '50px',
			minHeight: '50px',
          }
		  
          const svgStyle = {
            display: 'flex',
            justifyContent: 'space-evenly',
			paddingTop: '50px',
			paddingBottom: '50px',
          }
		  const headerStyle = {

		  }
          return(
            <div style={headerStyle}>

                <NavLink name={"VENUE"} link={"venue.html"} />
                <NavLink name={"ACCOMMODATIONS"} link={"accommodations.html"} />
                <NavLink name={"WEDDING PARTY"} link={"wedding_party.html"} />

      class Content extends React.Component {
        render() {
          const state = store.getState();
		  const navPadding = state.isNavFrozen ? {
			paddingTop: '106px',
		  } : {
			paddingTop: '0px',
		  };
          return(
            <div style={navPadding}>
              {(() => {
                switch(state.page.toUpperCase()){
                  case 'HOME':
                    return <Home />;
                  case 'VENUE':
                    return <Venue />;
                  case 'WEDDING PARTY':
                    return <WeddingParty />
                  case 'ACCOMMODATIONS':
                    return <Accommodations />
                  case 'REGISTRY':
                    return <Registry />
                  case 'PHOTOS':
                    return <Photos />
				  case 'FAQ':

                  default:

				<div style={storyStyle}>
					<p>
						We met on October 18, 2013 at Galway Hooker Pub on E 36th Street in New York City.
					</p>
					<p>
						Pat’s friend from work invited him to happy hour. Toni ran into the same friend, a friend from college, in the subway and he asked her to join. We hit it off immediately, talking about Game of Thrones, Harry Potter and Toni making Pat show her his license because she didn’t believe his last name was Manning. The night eventually came to an end and we left without exchanging phone numbers.
					</p>
					<p>

					</p>

					</p>

						On September 30, 2017 Pat told Toni he was taking her to brunch (like most weekends!). We walked to the Hoboken waterfront, where Pat walked Toni out to Pier C and got down on one knee with the New York City skyline in the background.
					</p>

		class GMap extends React.Component{

		  constructor(props){
			super(props);
			this.googleChecker = this.googleChecker.bind(this);
			this.initMap = this.initMap.bind(this);
		  }
		  
		  googleChecker() {
			if(!window.google) {
			  setTimeout(this.googleChecker, 100);
			} else {
			  this.initMap();
			}
		  }
		  
		  
		initMap() {
			const clubPosition = new google.maps.LatLng(this.props.lat, this.props.lon);
				var mapOptions = {
					center: clubPosition,
					zoom: 12,
				}
			var map = new google.maps.Map(document.getElementById("googleMap"), mapOptions);
			var marker = new google.maps.Marker({
			  position: clubPosition,
			  label: this.props.marker,
			  map: map
			});
		}
		  componentDidMount(){
			this.googleChecker();
		  }

		  render(){
			const mapStyle = {
				width: '100%',
				height: '100%',
				zIndex: -99,
			}
			const parentStyle = {
				display: 'flex',
				justifyContent: 'center',
				zIndex: -99,
			}
			return(
				<div style={parentStyle} >
					<div id="googleMap" style={mapStyle}></div>
				</div>
			);
		  }
		}

        class App extends React.Component {
          componentDidMount(){
            const {store} = this.context;
            this.unsubscribe = store.subscribe(() =>
              this.forceUpdate()
            );
			window.addEventListener('scroll', this.handleScroll);
          }
		  componentWillUnmount() {
			window.removeEventListener('scroll', this.handleScroll);
			}
		  handleScroll(e){
			const scrollHeight = 410;
			const state = store.getState();
			if(this.scrollY >= scrollHeight && !state.isNavFrozen ){
				store.dispatch(freezeNav(true));
			} else if (this.scrollY < scrollHeight && state.isNavFrozen) {
				store.dispatch(freezeNav(false));
			}
		  }
            render(){
              const { store } = this.context;
              const state = store.getState();
                return (
                    <div>
						<div>
							<Nav />
						</div>
                        <Content />
						<Footer />
                    </div>
                );
            }
        }
      
			  
      let store = createStore(getAppData);
      
      App.contextTypes = {
        store: React.PropTypes.object
      }
    
        ReactDOM.render(
          <Provider store={store}>
            <App />
          </Provider>,
            document.getElementById("root")
        );     
    </script>
